# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Docker Compose configuration optimized for Windows Server deployment
# Run with: docker-compose up -d

services:
  neomir-hana-gateway:
    image: jrneomir/neomir-hana-gateway:latest
    container_name: neomir-hana-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Add any additional environment variables here
      TZ: UTC
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Windows-style path mounting (supports both Windows and Linux Docker)
      # SSL certificates - create an 'ssl' folder in your project directory
      - type: bind
        source: ${SSL_PATH:-./ssl}
        target: /app/ssl
        read_only: true
      # Environment configuration - create env.local file in your project directory  
      - type: bind
        source: ${ENV_FILE:-./env.local}
        target: /app/.env.local
        read_only: true
      # Optional: Mount logs directory for persistent logging
      - type: bind
        source: ${LOGS_PATH:-./logs}
        target: /app/logs
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Resource limits (adjust based on your Windows Server specs)
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    # Network configuration
    networks:
      - neomir-network
    # Logging configuration for Windows Server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Watchtower service for automated container updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    environment:
      # Update check interval (default: 24 hours)
      WATCHTOWER_POLL_INTERVAL: 3600  # 1 hour in seconds
      # Only monitor specific containers (optional)
      WATCHTOWER_MONITOR_ONLY: "true"
      # Cleanup old images after update
      WATCHTOWER_CLEANUP: "true"
      # Include stopped containers in monitoring
      WATCHTOWER_INCLUDE_STOPPED: "true"
      # Set timezone
      TZ: UTC
      # Notification settings (optional - configure as needed)
      # WATCHTOWER_NOTIFICATION_URL: "slack://token@channel"
      # WATCHTOWER_NOTIFICATIONS: "slack"
      # Debug logging (remove in production)
      WATCHTOWER_DEBUG: "false"
    volumes:
      # Docker socket access (required for Watchtower to manage containers)
      - /var/run/docker.sock:/var/run/docker.sock
      # Windows Docker Desktop socket path alternative
      # - //./pipe/docker_engine:/var/run/docker.sock
    command: 
      # Monitor only the neomir-hana-gateway container
      - neomir-hana-gateway
      # Alternative: Monitor all containers by removing the above line
    networks:
      - neomir-network
    depends_on:
      - neomir-hana-gateway
    # Resource limits for Watchtower
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
        reservations:
          memory: 64M
          cpus: '0.05'
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# Custom network for better isolation
networks:
  neomir-network:
    driver: bridge
    name: neomir-network


